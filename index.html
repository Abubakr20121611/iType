<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iType</title>

<style>
:root{
  --bg:#323437;
  --panel:#2b2e31;
  --text:#d1d0c5;
  --muted:#646669;
  --accent:#e2b714;
  --good:#d1d0c5;
  --bad:#ca4754;
  --keyboard:#2c2f31;
  --key:#3a3d40;
  --key-border:#45484b;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea,select{
  font:inherit;
}

.app{
  width:min(1200px,calc(100% - 32px));
  margin:auto;
  padding:24px 0 34px;
}

/* ================= HEADER ================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:42px;
}

.brand{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1.8px;
}

.brand span{
  color:var(--accent);
}

.nav{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
}

.nav button:hover{
  color:var(--text);
  background:rgba(255,255,255,.035);
}

/* ================= CONTROLS ================= */

.controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:12px 15px;
  background:rgba(0,0,0,.10);
  border-radius:10px;
  margin-bottom:18px;
}

.group{
  display:flex;
  align-items:center;
  gap:7px;
}

.group-title{
  color:var(--accent);
  font-size:12px;
  margin-right:2px;
}

.control{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:5px 7px;
  border-radius:6px;
  cursor:pointer;
}

.control:hover{
  color:var(--text);
}

.control.active{
  color:var(--accent);
}

/* ================= TEST ================= */

.test-card{
  padding-top:12px;
}

.language-line{
  height:18px;
  color:var(--muted);
  font-size:12px;
  margin-bottom:10px;
}

.typing-wrap{
  position:relative;
  min-height:255px;
}

.typing-text{
  font-size:31px;
  line-height:1.6;
  letter-spacing:.1px;
  color:var(--muted);
  user-select:none;
  word-break:break-word;
}

.char{
  position:relative;
}

.char.correct{
  color:var(--good);
}

.char.wrong{
  color:var(--bad);
}

.char.current{
  color:var(--text);
}

.char.current::after{
  content:"";
  position:absolute;
  left:-2px;
  top:11%;
  width:2px;
  height:78%;
  background:var(--accent);
  border-radius:2px;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,45%{opacity:1}
  46%,100%{opacity:0}
}

/* ================= STATS ================= */

.stats{
  display:flex;
  gap:34px;
  flex-wrap:wrap;
  margin-top:8px;
  margin-bottom:24px;
}

.stat{
  min-width:95px;
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  text-transform:lowercase;
  margin-bottom:3px;
}

.stat-value{
  font-size:20px;
}

/* ================= KEYBOARD ================= */

.keyboard{
  background:rgba(0,0,0,.08);
  border-radius:16px;
  padding:12px 14px;
  border:1px solid rgba(255,255,255,.035);
  margin-top:12px;
}

.kb-row{
  display:flex;
  gap:5px;
  margin-bottom:5px;
}

.key{
  flex:1;
  height:48px;
  min-width:0;
  border:1px solid var(--key-border);
  background:var(--key);
  color:#8d9295;
  border-radius:7px;
  font-size:12px;
  cursor:pointer;
  transition:background .08s,color .08s,transform .08s;
}

.key:hover{
  background:#43474a;
  color:var(--text);
}

.key.active{
  background:var(--accent);
  color:#242424;
  border-color:var(--accent);
  transform:translateY(1px);
}

.key.wide{
  flex:1.45;
}

.key.space{
  flex:6;
}

/* ================= BOTTOM ================= */

.bottom{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:22px;
}

.restart{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  padding:8px 12px;
  border-radius:8px;
}

.restart:hover{
  color:var(--text);
  background:rgba(255,255,255,.035);
}

.tip{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:12px;
}

/* ================= INPUT ================= */

.hidden-input{
  position:fixed;
  left:-10000px;
  top:0;
  width:1px;
  height:1px;
  opacity:0;
}

/* ================= MODALS ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:50;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(620px,100%);
  background:var(--panel);
  border:1px solid rgba(255,255,255,.07);
  border-radius:15px;
  padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.modal-head h3{
  margin:0;
  font-size:19px;
}

.close{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:20px;
  cursor:pointer;
}

.close:hover{
  color:var(--text);
}

/* ================= RESULT ================= */

.result-main{
  text-align:center;
}

.result-label{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.result-wpm{
  font-size:84px;
  font-weight:900;
  color:var(--accent);
  line-height:1;
  margin:10px 0;
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:22px 0;
}

.result-item{
  background:rgba(0,0,0,.10);
  padding:13px 8px;
  border-radius:10px;
}

.result-item strong{
  display:block;
  font-size:18px;
}

.result-item span{
  font-size:10px;
  color:var(--muted);
}

.primary{
  border:0;
  background:var(--accent);
  color:#1f2021;
  font-weight:800;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
}

/* ================= CUSTOM ================= */

.modal-input,
.modal-textarea{
  width:100%;
  background:#232629;
  color:var(--text);
  border:1px solid #3c4043;
  border-radius:8px;
  padding:11px 12px;
  outline:none;
}

.modal-textarea{
  min-height:160px;
  resize:vertical;
}

.custom-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.custom-list{
  margin-top:18px;
  display:grid;
  gap:8px;
  max-height:280px;
  overflow:auto;
}

.custom-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.055);
  border-radius:9px;
  background:rgba(0,0,0,.08);
}

.custom-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.small-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}

.small-btn:hover{
  color:var(--text);
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:18px;
}

/* ================= LIGHT ================= */

.light{
  --bg:#f2f2f2;
  --panel:#ffffff;
  --text:#2e3133;
  --muted:#909395;
  --good:#2f3335;
  --keyboard:#e4e6e8;
  --key:#d9dcdf;
  --key-border:#c9cccf;
}

.light .controls,
.light .keyboard{
  background:rgba(0,0,0,.035);
}

.light .modal-input,
.light .modal-textarea{
  background:#f3f4f5;
  color:#2e3133;
  border-color:#d2d5d7;
}

.light .char.current{
  color:#2e3133;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .typing-text{
    font-size:26px;
  }

  .key{
    height:43px;
  }

}

@media(max-width:650px){

  .app{
    width:min(100% - 20px,1200px);
    padding-top:14px;
  }

  .header{
    margin-bottom:28px;
  }

  .nav button{
    padding:6px;
  }

  .controls{
    gap:6px;
    padding:10px;
  }

  .typing-text{
    font-size:21px;
    line-height:1.7;
  }

  .typing-wrap{
    min-height:260px;
  }

  .stats{
    gap:18px;
  }

  .stat{
    min-width:72px;
  }

  .stat-value{
    font-size:18px;
  }

  .key{
    height:36px;
    font-size:9px;
  }

  .keyboard{
    padding:8px;
  }

  .kb-row{
    gap:3px;
    margin-bottom:3px;
  }

  .result-wpm{
    font-size:68px;
  }

  .result-grid{
    grid-template-columns:repeat(3,1fr);
  }

}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">
      i<span>Type</span>
    </div>

    <div class="nav">
      <button id="customBtn">custom</button>
      <button id="themeBtn">◐</button>
    </div>

  </header>


  <!-- CONTROLS -->

  <div class="controls">

    <div class="group">

      <span class="group-title">time</span>

      <button class="control active" data-time="15">
        15
      </button>

      <button class="control" data-time="30">
        30
      </button>

      <button class="control" data-time="60">
        60
      </button>

      <button class="control" data-time="120">
        120
      </button>

    </div>


    <div class="group">

      <span class="group-title">words</span>

      <button class="control" data-words="10">
        10
      </button>

      <button class="control" data-words="25">
        25
      </button>

      <button class="control" data-words="50">
        50
      </button>

      <button class="control" data-words="100">
        100
      </button>

    </div>


    <div class="group">

      <span class="group-title">language</span>

      <button class="control active" data-lang="en-US">
        english
      </button>

      <button class="control" data-lang="uz-UZ">
        uzbek
      </button>

      <button class="control" data-lang="ru-RU">
        russian
      </button>

      <button class="control" data-lang="ko-KR">
        korean
      </button>

    </div>

  </div>


  <!-- TEST -->

  <main class="test-card">

    <div id="languageLine" class="language-line">
      english
    </div>

    <div class="typing-wrap">

      <div id="typingText" class="typing-text"></div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <div class="stat-label">wpm</div>
        <div id="wpm" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">acc</div>
        <div id="accuracy" class="stat-value">100%</div>
      </div>

      <div class="stat">
        <div class="stat-label">raw</div>
        <div id="raw" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">errors</div>
        <div id="errors" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">time</div>
        <div id="time" class="stat-value">00:15</div>
      </div>

      <div class="stat">
        <div class="stat-label">chars</div>
        <div id="chars" class="stat-value">0/0/0</div>
      </div>

    </div>


    <!-- KEYBOARD -->

    <div class="keyboard">

      <div class="kb-row">

        <button class="key" data-key="q">Q</button>
        <button class="key" data-key="w">W</button>
        <button class="key" data-key="e">E</button>
        <button class="key" data-key="r">R</button>
        <button class="key" data-key="t">T</button>
        <button class="key" data-key="y">Y</button>
        <button class="key" data-key="u">U</button>
        <button class="key" data-key="i">I</button>
        <button class="key" data-key="o">O</button>
        <button class="key" data-key="p">P</button>

      </div>

      <div class="kb-row">

        <button class="key" data-key="a">A</button>
        <button class="key" data-key="s">S</button>
        <button class="key" data-key="d">D</button>
        <button class="key" data-key="f">F</button>
        <button class="key" data-key="g">G</button>
        <button class="key" data-key="h">H</button>
        <button class="key" data-key="j">J</button>
        <button class="key" data-key="k">K</button>
        <button class="key" data-key="l">L</button>

      </div>

      <div class="kb-row">

        <button class="key" data-key="z">Z</button>
        <button class="key" data-key="x">X</button>
        <button class="key" data-key="c">C</button>
        <button class="key" data-key="v">V</button>
        <button class="key" data-key="b">B</button>
        <button class="key" data-key="n">N</button>
        <button class="key" data-key="m">M</button>

      </div>

      <div class="kb-row">

        <button class="key wide" data-key="Backspace">⌫</button>

        <button class="key space" data-key=" ">
          SPACE
        </button>

        <button class="key wide" data-key="Enter">
          ↵
        </button>

      </div>

    </div>


    <div class="bottom">

      <button id="restartBtn" class="restart">
        ↻ restart
      </button>

    </div>

    <div class="tip">
      click anywhere and type • clipboard shortcuts disabled
    </div>

  </main>

</div>


<!-- HIDDEN INPUT -->

<textarea
  id="input"
  class="hidden-input"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
></textarea>


<!-- RESULT -->

<div id="resultOverlay" class="overlay">

  <div class="modal result-main">

    <div class="result-label">
      test complete
    </div>

    <div id="resultWpm" class="result-wpm">
      0
    </div>

    <div style="color:var(--muted)">
      wpm
    </div>

    <div class="result-grid">

      <div class="result-item">
        <strong id="resultAcc">100%</strong>
        <span>accuracy</span>
      </div>

      <div class="result-item">
        <strong id="resultErrors">0</strong>
        <span>errors</span>
      </div>

      <div class="result-item">
        <strong id="resultChars">0</strong>
        <span>characters</span>
      </div>

    </div>

    <button id="resultRestart" class="primary">
      restart
    </button>

  </div>

</div>


<!-- CUSTOM -->

<div id="customOverlay" class="overlay">

  <div class="modal">

    <div class="modal-head">

      <h3>Custom text</h3>

      <button
        class="close"
        data-close="customOverlay"
      >
        ×
      </button>

    </div>

    <input
      id="customName"
      class="modal-input"
      placeholder="Text name"
    >

    <div style="height:8px"></div>

    <textarea
      id="customText"
      class="modal-textarea"
      placeholder="Write your own text..."
    ></textarea>

    <div class="custom-actions">

      <button
        id="saveCustom"
        class="primary"
      >
        save text
      </button>

      <button
        id="clearCustom"
        class="small-btn"
      >
        clear
      </button>

    </div>

    <div
      id="customList"
      class="custom-list"
    ></div>

  </div>

</div>


<script>

const TEXTS = {

  "en-US":[
    "the","of","and","to","in","a","is","that","for","it",
    "as","was","with","be","by","on","not","he","i","this",
    "are","or","his","from","at","which","but","have","an",
    "had","they","you","were","their","one","all","we","can",
    "her","has","there","been","if","more","when","will",
    "would","who","so","what","up","about","out","how","get",
    "go","me","make","like","time","just","know","take",
    "people","into","year","your","good","some","could",
    "them","see","other","than","then","now","look","only",
    "come","its","over","think","also","back","after","use",
    "two","our","work","first","well","way","even","new",
    "want","because","these","give","day"
  ],

  "uz-UZ":[
    "bu","va","ham","uchun","bilan","bir","bor","deb","edi",
    "men","sen","u","biz","ular","emas","keladi","qiladi",
    "kerak","mumkin","yaxshi","katta","kichik","yangi","eski",
    "kun","vaqt","inson","maktab","kitob","uy","ish","hayot",
    "dunyo","til","so‘z","fikr","bilim","olish","berish",
    "ko‘rish","yozish","o‘qish","o‘rganish","har","qanday",
    "keyin","oldin","hozir","yana","juda","eng","ko‘p","kam",
    "hamma","boshqa","birinchi","muhim","tez","aniq","to‘g‘ri",
    "oddiy","qiziqarli","kelajak","maqsad"
  ],

  "ru-RU":[
    "и","в","не","на","я","что","он","с","а","как",
    "это","по","но","мы","из","за","у","к","о","же",
    "быть","был","она","они","мне","для","ты","от","так",
    "его","все","тот","этот","мог","если","уже","есть",
    "можно","нужно","будет","когда","только","такой",
    "чтобы","свой","который","человек","время","год","день",
    "дом","работа","школа","книга","мир","новый","большой",
    "маленький","хороший","быстро","точно","важный","знание",
    "учиться","читать","писать","работать","думать","говорить"
  ],

  "ko-KR":[
    "오늘","나는","너는","우리","사람","시간","하루","학교",
    "공부","책","컴퓨터","키보드","연습","속도","정확도",
    "좋은","새로운","작은","큰","많은","모든","그리고",
    "하지만","그래서","정말","매우","이것","저것","그것",
    "여기","저기","지금","내일","어제","매일","함께",
    "천천히","빠르게","배우다","읽다","쓰다","말하다",
    "생각하다","만들다","하다","가다","오다","보다","알다",
    "원하다","필요하다","중요하다","시작","연습하다",
    "공부하다","미래","목표","좋아요"
  ]

};


const LANG_NAMES = {

  "en-US":"english",
  "uz-UZ":"uzbek",
  "ru-RU":"russian",
  "ko-KR":"korean"

};


let state = {

  mode:"time",

  limit:15,

  language:"en-US",

  source:"",

  started:false,

  finished:false,

  start:0,

  timer:null,

  customActive:null

};


const input =
  document.getElementById("input");

const typingText =
  document.getElementById("typingText");

const wpm =
  document.getElementById("wpm");

const accuracy =
  document.getElementById("accuracy");

const raw =
  document.getElementById("raw");

const errors =
  document.getElementById("errors");

const time =
  document.getElementById("time");

const chars =
  document.getElementById("chars");

const languageLine =
  document.getElementById("languageLine");


/* ==========================
   TEXT
========================== */

function randomWords(count){

  const list =
    TEXTS[state.language] ||
    TEXTS["en-US"];

  const result = [];

  for(let i=0;i<count;i++){

    result.push(
      list[
        Math.floor(
          Math.random()*list.length
        )
      ]
    );

  }

  return result.join(" ");

}


function buildSource(){

  if(state.customActive){

    state.source =
      state.customActive.text;

    return;

  }

  if(state.mode === "words"){

    state.source =
      randomWords(state.limit);

  }else{

    state.source =
      randomWords(180);

  }

}


/* ==========================
   RENDER
========================== */

function render(typed){

  const sourceChars =
    Array.from(state.source);

  const typedChars =
    Array.from(typed);

  let html = "";

  for(
    let i=0;
    i<sourceChars.length;
    i++
  ){

    const char =
      escapeHTML(sourceChars[i]);

    if(i < typedChars.length){

      if(
        typedChars[i] ===
        sourceChars[i]
      ){

        html +=
          `<span class="char correct">${char}</span>`;

      }else{

        html +=
          `<span class="char wrong">${char}</span>`;

      }

    }else if(
      i === typedChars.length
    ){

      html +=
        `<span class="char current">${char}</span>`;

    }else{

      html +=
        `<span class="char">${char}</span>`;

    }

  }

  typingText.innerHTML =
    html;

}


/* ==========================
   STATS
========================== */

function resetStats(){

  wpm.textContent = "0";

  accuracy.textContent =
    "100%";

  raw.textContent = "0";

  errors.textContent = "0";

  chars.textContent =
    "0/0/0";

  time.textContent =
    state.mode === "time"
      ? formatTime(state.limit)
      : "00:00";

}


function calculate(){

  const typed =
    Array.from(input.value);

  const source =
    Array.from(state.source);

  let correct = 0;

  let errorCount = 0;

  typed.forEach(
    (char,index)=>{

      if(
        char === source[index]
      ){

        correct++;

      }else{

        errorCount++;

      }

    }
  );


  const elapsed =
    Math.max(
      (performance.now()-state.start)/1000,
      0.01
    );

  const minutes =
    elapsed/60;


  const currentWpm =
    Math.round(
      (correct/5)/minutes
    );


  const currentRaw =
    Math.round(
      (typed.length/5)/minutes
    );


  const currentAccuracy =
    typed.length === 0
      ? 100
      : Math.max(
          0,
          Math.round(
            correct /
            typed.length *
            100
          )
        );


  wpm.textContent =
    currentWpm;

  raw.textContent =
    currentRaw;

  accuracy.textContent =
    currentAccuracy + "%";

  errors.textContent =
    errorCount;

  chars.textContent =
    `${correct}/${typed.length}/${errorCount}`;


  return {

    correct,

    errors:errorCount,

    wpm:currentWpm,

    accuracy:currentAccuracy,

    chars:typed.length,

    elapsed

  };

}


/* ==========================
   TIMER
========================== */

function startTimer(){

  clearInterval(state.timer);

  state.timer =
    setInterval(

      ()=>{

        if(
          !state.started ||
          state.finished
        ){

          return;

        }


        const elapsed =
          (performance.now() -
           state.start)/1000;


        if(
          state.mode === "time"
        ){

          const remaining =
            Math.max(
              state.limit-elapsed,
              0
            );

          time.textContent =
            formatTime(remaining);


          if(
            remaining <= 0
          ){

            finish();

          }

        }else{

          time.textContent =
            formatTime(elapsed);

        }

      },

      100

    );

}


function stopTimer(){

  clearInterval(
    state.timer
  );

  state.timer = null;

}


/* ==========================
   INPUT
========================== */

input.addEventListener(
  "input",
  ()=>{

    if(state.finished)
      return;


    if(!state.started){

      state.started = true;

      state.start =
        performance.now();

      startTimer();

    }


    const typed =
      input.value;


    render(typed);

    calculate();


    if(
      state.mode === "words"
    ){

      const count =
        typed
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .length;


      if(
        count >= state.limit
      ){

        finish();

        return;

      }

    }


    if(
      state.mode === "time" &&
      typed.length >
      state.source.length - 100
    ){

      state.source +=
        " " +
        randomWords(60);

      render(typed);

    }

  }
);


/* ==========================
   FINISH
========================== */

function finish(){

  if(state.finished)
    return;


  state.finished = true;

  state.started = false;

  stopTimer();


  const result =
    calculate();


  document.getElementById(
    "resultWpm"
  ).textContent =
    result.wpm;


  document.getElementById(
    "resultAcc"
  ).textContent =
    result.accuracy + "%";


  document.getElementById(
    "resultErrors"
  ).textContent =
    result.errors;


  document.getElementById(
    "resultChars"
  ).textContent =
    result.chars;


  document
    .getElementById(
      "resultOverlay"
    )
    .classList.add("show");

}


/* ==========================
   RESTART
========================== */

function restart(){

  stopTimer();

  state.started = false;

  state.finished = false;

  state.start = 0;

  input.value = "";

  resetStats();

  buildSource();

  render("");

  document
    .getElementById(
      "resultOverlay"
    )
    .classList.remove("show");

  focusInput();

}


/* ==========================
   LANGUAGE
========================== */

document
  .querySelectorAll("[data-lang]")
  .forEach(

    button => {

      button.addEventListener(
        "click",
        ()=>{

          if(state.started)
            return;


          state.language =
            button.dataset.lang;


          state.customActive =
            null;


          document
            .querySelectorAll(
              "[data-lang]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          languageLine.textContent =
            LANG_NAMES[
              state.language
            ];


          restart();

        }
      );

    }

  );


/* ==========================
   TIME
========================== */

document
  .querySelectorAll("[data-time]")
  .forEach(

    button=>{

      button.addEventListener(
        "click",
        ()=>{

          if(state.started)
            return;


          state.mode = "time";

          state.limit =
            Number(
              button.dataset.time
            );


          state.customActive =
            null;


          document
            .querySelectorAll(
              "[data-time]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          document
            .querySelectorAll(
              "[data-words]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          restart();

        }
      );

    }

  );


/* ==========================
   WORDS
========================== */

document
  .querySelectorAll("[data-words]")
  .forEach(

    button=>{

      button.addEventListener(
        "click",
        ()=>{

          if(state.started)
            return;


          state.mode =
            "words";


          state.limit =
            Number(
              button.dataset.words
            );


          state.customActive =
            null;


          document
            .querySelectorAll(
              "[data-words]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          document
            .querySelectorAll(
              "[data-time]"
            )
            .forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          restart();

        }
      );

    }

  );


/* ==========================
   KEYBOARD
========================== */

document
  .querySelectorAll(".key")
  .forEach(

    key=>{

      key.addEventListener(
        "mousedown",
        e=>{

          e.preventDefault();


          const value =
            key.dataset.key;


          if(value === "Backspace"){

            input.value =
              input.value.slice(
                0,
                -1
              );

          }else if(
            value === "Enter"
          ){

            input.value += "\n";

          }else{

            input.value +=
              value;

          }


          input.dispatchEvent(
            new Event(
              "input",
              {bubbles:true}
            )
          );


          highlightKey(value);

          focusInput();

        }
      );

    }

  );


function highlightKey(key){

  const target =
    key === " "
      ? " "
      : key.toLowerCase();


  document
    .querySelectorAll(".key")
    .forEach(
      k => {

        if(
          k.dataset.key === target
        ){

          k.classList.add(
            "active"
          );


          setTimeout(
            ()=>{
              k.classList.remove(
                "active"
              );
            },
            90
          );

        }

      }
    );

}


/* ==========================
   KEYBOARD EVENTS
========================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.ctrlKey ||
      e.metaKey
    ){

      const key =
        e.key.toLowerCase();


      if(
        key === "c" ||
        key === "v" ||
        key === "x" ||
        key === "a"
      ){

        e.preventDefault();

      }

    }


    if(e.key === "Tab"){

      e.preventDefault();

    }


    highlightKey(e.key);

  }
);


/* ==========================
   CLIPBOARD BLOCK
========================== */

[
  "copy",
  "cut",
  "paste",
  "drop"
].forEach(
  type=>{

    input.addEventListener(
      type,
      e=>{
        e.preventDefault();
      }
    );

  }
);


/* ==========================
   CUSTOM TEXT
========================== */

function getCustomTexts(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "itype-customs"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveCustomTexts(list){

  localStorage.setItem(
    "itype-customs",
    JSON.stringify(list)
  );

}


function renderCustomList(){

  const list =
    getCustomTexts();


  if(!list.length){

    document.getElementById(
      "customList"
    ).innerHTML =
      `<div class="empty">
        No custom texts yet.
      </div>`;

    return;

  }


  document.getElementById(
    "customList"
  ).innerHTML =

    list.map(
      item => `

        <div class="custom-item">

          <div>

            <strong>
              ${escapeHTML(item.name)}
            </strong>

            <div class="custom-meta">

              ${escapeHTML(
                item.text.slice(0,70)
              )}

              ${
                item.text.length > 70
                  ? "…"
                  : ""
              }

            </div>

          </div>

          <div style="display:flex;gap:8px">

            <button
              class="small-btn"
              data-use="${item.id}"
            >
              use
            </button>

            <button
              class="small-btn"
              data-delete="${item.id}"
            >
              delete
            </button>

          </div>

        </div>

      `
    ).join("");


  document
    .querySelectorAll(
      "[data-use]"
    )
    .forEach(

      button=>{

        button.addEventListener(
          "click",
          ()=>{

            const item =
              getCustomTexts()
                .find(
                  x =>
                    x.id ===
                    Number(
                      button.dataset.use
                    )
                );


            if(!item)
              return;


            state.customActive =
              item;


            state.mode =
              "custom";


            restart();


            document
              .getElementById(
                "customOverlay"
              )
              .classList.remove(
                "show"
              );

          }
        );

      }

    );


  document
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(

      button=>{

        button.addEventListener(
          "click",
          ()=>{

            const newList =
              getCustomTexts()
                .filter(
                  x =>
                    x.id !==
                    Number(
                      button.dataset.delete
                    )
                );


            saveCustomTexts(
              newList
            );


            renderCustomList();

          }
        );

      }

    );

}


/* OPEN CUSTOM */

document
  .getElementById(
    "customBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      renderCustomList();

      document
        .getElementById(
          "customOverlay"
        )
        .classList.add(
          "show"
        );

    }
  );


/* SAVE CUSTOM */

document
  .getElementById(
    "saveCustom"
  )
  .addEventListener(
    "click",
    ()=>{

      const name =
        document
          .getElementById(
            "customName"
          )
          .value
          .trim() ||
        "My text";


      const text =
        document
          .getElementById(
            "customText"
          )
          .value
          .trim();


      if(!text){

        document
          .getElementById(
            "customText"
          )
          .focus();

        return;

      }


      const list =
        getCustomTexts();


      list.unshift({

        id:Date.now(),

        name,

        text

      });


      saveCustomTexts(
        list.slice(0,50)
      );


      document
        .getElementById(
          "customName"
        )
        .value = "";


      document
        .getElementById(
          "customText"
        )
        .value = "";


      renderCustomList();

    }
  );


/* CLEAR CUSTOM FORM */

document
  .getElementById(
    "clearCustom"
  )
  .addEventListener(
    "click",
    ()=>{

      document
        .getElementById(
          "customName"
        )
        .value = "";


      document
        .getElementById(
          "customText"
        )
        .value = "";

    }
  );


/* ==========================
   MODAL CLOSE
========================== */

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(

    button=>{

      button.addEventListener(
        "click",
        ()=>{

          document
            .getElementById(
              button.dataset.close
            )
            .classList.remove(
              "show"
            );

        }
      );

    }

  );


document
  .querySelectorAll(
    ".overlay"
  )
  .forEach(

    overlay=>{

      overlay.addEventListener(
        "click",
        e=>{

          if(
            e.target === overlay
          ){

            overlay.classList.remove(
              "show"
            );

          }

        }
      );

    }

  );


/* ==========================
   THEME
========================== */

document
  .getElementById(
    "themeBtn"
  )
  .addEventListener(
    "click",
    ()=>{

      document.body
        .classList.toggle(
          "light"
        );


      localStorage.setItem(
        "itype-theme",
        document.body.classList.contains(
          "light"
        )
          ? "light"
          : "dark"
      );

    }
  );


if(
  localStorage.getItem(
    "itype-theme"
  ) === "light"
){

  document.body
    .classList.add(
      "light"
    );

}


/* ==========================
   ESCAPE
========================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".overlay.show"
        )
        .forEach(
          overlay =>
            overlay.classList.remove(
              "show"
            )
        );

    }

  }
);


/* ==========================
   FOCUS
========================== */

function focusInput(){

  if(!state.finished){

    input.focus();

  }

}


document.addEventListener(
  "click",
  e=>{

    if(
      !e.target.closest(
        "button,.modal"
      )
    ){

      focusInput();

    }

  }
);


/* ==========================
   HELPERS
========================== */

function formatTime(seconds){

  const total =
    Math.ceil(
      Math.max(
        seconds,
        0
      )
    );


  const minutes =
    Math.floor(
      total/60
    );


  const secondsPart =
    total % 60;


  return (

    String(minutes)
      .padStart(2,"0")

    + ":" +

    String(secondsPart)
      .padStart(2,"0")

  );

}


function escapeHTML(text){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ==========================
   START
========================== */

restart();

</script>
